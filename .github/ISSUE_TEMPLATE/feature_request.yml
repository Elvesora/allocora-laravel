name: Feature request
description: Propose an improvement to the public Laravel client.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Explain the supported client workflow that is difficult today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: checkboxes
    id: boundary
    attributes:
      label: Public-boundary confirmation
      options:
        - label: This request concerns an operation in the published API manifest.
          required: true
